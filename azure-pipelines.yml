trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    displayName: Build and Test
    jobs:
      - job: Build
        steps:
          - task: UseDotNet@2
            displayName: Install .NET 10
            inputs:
              packageType: sdk
              version: '10.x'

          - script: dotnet restore
            displayName: Restore

          - script: dotnet build --no-restore --configuration Release
            displayName: Build

          - script: dotnet test --no-build --configuration Release
            displayName: Test
